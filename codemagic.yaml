workflows:
  airstrike-ios:
    name: AIRSTRIKE iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.5"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned iOS app
        script: |
          xcodebuild -project AIRSTRIKE.xcodeproj \
            -scheme AIRSTRIKE \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/DerivedData/Build/Products/Release-iphoneos/AIRSTRIKE.app
